<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin – AVCOE Study Material</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0b1020;color:#e8ecf8;min-height:100vh}
.wrap{max-width:1000px;margin:auto;padding:16px}
.card{background:#151b33;border:1px solid #263056;border-radius:14px;padding:18px;margin:12px 0}
h1{font-size:20px}h2{font-size:17px;margin-bottom:8px}
.sub{color:#8f9bc4;font-size:13px}
input{width:100%;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #2b3665;background:#0b1020;color:#fff;font-size:15px}
button{padding:10px 14px;border:0;border-radius:9px;background:#4f7cff;color:#fff;font-weight:600;cursor:pointer;font-size:14px}
button.g{background:#25d366;color:#04210f}button.r{background:#e5484d}button.s{background:#263056}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#151b33;border-bottom:1px solid #263056}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{background:#263056}.tabs button.on{background:#4f7cff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:#151b33;border:1px solid #263056;border-radius:12px;padding:16px 10px;text-align:center;cursor:pointer;word-break:break-word;position:relative}
.item:hover{border-color:#4f7cff}.item .i{font-size:34px}.item small{display:block;color:#8f9bc4;margin-top:4px}
.item .x{position:absolute;top:4px;right:4px;padding:2px 7px;font-size:12px}
.crumb{color:#8f9bc4;font-size:14px;margin:8px 0}.crumb b{color:#4f7cff;cursor:pointer}
.hide{display:none!important}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #263056;text-align:left;vertical-align:top}
.badge{background:#e5484d;border-radius:99px;padding:1px 8px;font-size:12px;margin-left:4px}
.act{display:flex;gap:4px;justify-content:center;margin-top:10px;flex-wrap:wrap}.act button{padding:5px 8px;font-size:13px;background:#263056}.act button.r{background:#e5484d}
.vc{display:block;color:#8f9bc4;font-size:12px;margin-top:4px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:14px}.modal .card{width:100%;max-width:560px;max-height:85vh;overflow:auto;margin:0}
#msg{color:#ffb4b4;font-size:13px;margin-top:6px}
@media(max-width:640px){
 .wrap{padding:12px}input{font-size:16px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .tabs button{flex:1}
 .item .x{padding:6px 10px;font-size:14px}
 #p1 .row button{flex:1 1 45%}
 table,tbody,tr,td{display:block}tbody tr:first-child{display:none}
 tr{border:1px solid #263056;border-radius:10px;margin-bottom:10px;padding:6px}
 td{border:0;padding:4px 6px;word-break:break-word}
 td .row button{flex:1}
}
</style>
</head>
<body>

<div id="login" class="wrap hide">
  <div class="card" style="margin-top:8vh">
    <h1>🔐 Admin Login</h1>
    <p class="sub">Authorized admin only</p><br>
    <input id="em" type="email" placeholder="Admin Email" value="admin@gmail.com">
    <input id="pw" type="password" placeholder="Password">
    <button onclick="doLogin()" style="margin-top:8px">Login</button>
    <div id="msg"></div>
  </div>
</div>

<div id="app" class="hide">
  <div class="bar"><b>⚙️ Admin Panel – AVCOE</b><button class="s" onclick="doLogout()">Logout</button></div>
  <div class="wrap">
    <div class="tabs">
      <button id="t1" class="on" onclick="tab(1)">📁 Content</button>
      <button id="t2" onclick="tab(2)">👤 Users <span id="pc" class="badge hide"></span></button>
      <button id="t3" onclick="tab(3)">📩 Requests <span id="rc" class="badge hide"></span></button>
    </div>

    <div id="p1">
      <div class="crumb" id="crumb"></div>
      <div class="row" style="margin-bottom:10px">
        <button onclick="newFolder()">📁 New Folder</button>
        <button onclick="document.getElementById('up').click()">⬆️ Upload PDF/Photo</button>
        <button class="s" onclick="addLink()">🔗 Add Link</button>
        <input type="file" id="up" multiple accept="application/pdf,image/*" class="hide" onchange="upload(this.files)">
        <span class="sub" id="upst"></span>
      </div>
      <div class="grid" id="grid"></div>
      <p class="sub" id="empty"></p>
    </div>

    <div id="p3" class="hide"><div id="rl"></div></div>

    <div id="p2" class="hide card">
      <div class="card" style="margin:0 0 12px;background:#0f1530"><div class="row" style="justify-content:space-between"><b>🎁 Free Trial</b><span id="trst"></span></div>
        <div class="row" style="margin-top:8px"><button id="trtog" onclick="toggleTrial()">…</button><input id="trh" type="number" min="1" style="width:100px" placeholder="Hours"><span class="sub">hours per user</span><button class="s" onclick="saveTrial()">Save hours</button></div>
        <p class="sub" style="margin-top:6px">ON: unapproved students can start a one-time trial. OFF: all running trials stop immediately.</p></div>
      <div class="row" style="justify-content:space-between"><h2>Users</h2><button class="s" onclick="loadUsers()">🔄 Refresh</button></div>
      <input id="srch" placeholder="Search name / email" oninput="loadUsers()">
      <div style="overflow:auto"><table id="utable"></table></div>
    </div>
  </div>
</div>

<div id="md" class="modal hide" onclick="if(event.target===this)closeModal()"><div class="card">
  <div class="row" style="justify-content:space-between"><h2 id="mdt" style="margin:0"></h2><button class="s" onclick="closeModal()">✕</button></div>
  <div id="mdb" style="margin-top:10px"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, serverTimestamp, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyBcXm5QQaYCCddVXNgGqTBAszdKEK-0PJQ", authDomain: "multi-service-app-77dd8.firebaseapp.com", projectId: "multi-service-app-77dd8", storageBucket: "multi-service-app-77dd8.appspot.com", messagingSenderId: "123732555482", appId: "1:123732555482:web:ea47c825e0dbb504f597e3" };
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);

// ⚠️ index.html mein bhi yahi email rakhna
const ADMINS = ["admin@gmail.com"];
const CLOUD = "dbirgrdbp", PRESET = "ml_default";   // Cloudinary

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur = "root", trail = [{id:"root",name:"Home"}];

window.doLogin = async () => { try { await signInWithEmailAndPassword(auth, $("em").value, $("pw").value); } catch(e){ $("msg").textContent = "Wrong email or password"; } };
window.doLogout = () => signOut(auth).then(()=>location.reload());

onAuthStateChanged(auth, async u => {
  if (!u) { $("login").classList.remove("hide"); $("app").classList.add("hide"); return; }
  if (!ADMINS.includes(u.email)) { await signOut(auth); $("msg").textContent = "❌ This is not an admin account"; return; }
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  load(); pendingCount(); loadReqs();
});

window.tab = n => {
  [1,2,3].forEach(i => { $("p"+i).classList.toggle("hide", i!==n); $("t"+i).classList.toggle("on", i===n); });
  if (n===2) loadUsers(); if (n===3) loadReqs();
};

let all = [], views = {};
const kidsOf = id => all.filter(n => n.parent === id);
const byId = id => all.find(n => n.id === id);
const pathOf = id => { const t = []; let n = byId(id); while (n) { t.unshift(n.name); n = byId(n.parent); } return t.join(" › "); };
const descIds = id => kidsOf(id).flatMap(n => [n.id, ...descIds(n.id)]);
const tot = id => (views[id]||[]).reduce((a,v) => a + (v.count||0), 0);
const modal = (t,h) => { $("mdt").textContent = t; $("mdb").innerHTML = h; $("md").classList.remove("hide"); };
window.closeModal = () => $("md").classList.add("hide");

async function load(){
  const [ns, vs] = await Promise.all([getDocs(collection(db,"nodes")), getDocs(collection(db,"fileViews")).catch(() => ({docs:[]}))]);
  all = ns.docs.map(d => ({id:d.id, ...d.data()}));
  views = {}; vs.docs.forEach(d => { const v = d.data(); (views[v.fileId] = views[v.fileId] || []).push(v); });
  render();
}
function render(){
  const items = kidsOf(cur).sort((a,b) => (a.type===b.type ? a.name.localeCompare(b.name) : a.type==="folder"?-1:1));
  $("grid").innerHTML = "";
  items.forEach(n => {
    const d = document.createElement("div"); d.className = "item"; const f = n.type === "file";
    d.innerHTML = `<div class="i">${n.type==="folder"?"📁":n.kind==="pdf"?"📕":"🖼️"}</div>${esc(n.name)}<small>${f ? n.kind.toUpperCase() : kidsOf(n.id).length + " items"}</small>` + (f ? `<span class="vc">👁 ${tot(n.id)} opens • ${(views[n.id]||[]).length} users</span>` : "");
    if (!f) d.onclick = () => { trail.push({id:n.id,name:n.name}); cur = n.id; render(); };
    else d.onclick = () => showViews(n);
    const act = document.createElement("div"); act.className = "act";
    const mk = (t,title,fn,cls) => { const b = document.createElement("button"); b.textContent = t; b.title = title; if (cls) b.className = cls; b.onclick = e => { e.stopPropagation(); fn(n); }; act.appendChild(b); };
    if (f) mk("👁","Who opened", showViews);
    mk("✏️","Rename", rename); mk("📂","Move", x => pick(x,"move")); mk("📋","Copy", x => pick(x,"copy")); mk("✕","Delete", delNode, "r");
    d.appendChild(act); $("grid").appendChild(d);
  });
  $("empty").textContent = items.length ? "" : "This folder is empty. Add a folder, file or link above.";
  $("crumb").innerHTML = trail.map((t,i) => `<b onclick="goTo(${i})">${esc(t.name)}</b>`).join(" › ");
}
window.goTo = i => { trail = trail.slice(0,i+1); cur = trail[i].id; render(); };
async function rename(n){
  const nm = prompt("New name:", n.name); if (!nm || !nm.trim() || nm.trim() === n.name) return;
  await updateDoc(doc(db,"nodes",n.id), { name:nm.trim() }); load();
}
function pick(n, mode){
  const bad = new Set(n.type === "folder" ? [n.id, ...descIds(n.id)] : []);
  const opts = [{id:"root", label:"🏠 Home (root)"}, ...all.filter(f => f.type==="folder" && !bad.has(f.id)).map(f => ({id:f.id, label:"📁 " + pathOf(f.id)})).sort((a,b) => a.label.localeCompare(b.label))];
  modal((mode==="move" ? "Move" : "Copy") + ` “${n.name}” to…`, opts.map(o => `<button class="s" style="width:100%;text-align:left;margin:4px 0" data-id="${o.id}">${esc(o.label)}</button>`).join(""));
  $("mdb").querySelectorAll("button").forEach(b => b.onclick = async () => {
    closeModal(); const dest = b.dataset.id;
    if (mode === "move") { if (dest === n.parent) return; await updateDoc(doc(db,"nodes",n.id), { parent:dest }); }
    else await cloneNode(n, dest, dest === n.parent ? n.name + " (copy)" : null);
    load();
  });
}
async function cloneNode(n, parent, nm){
  const { id, createdAt, ...rest } = n;
  const r = await addDoc(collection(db,"nodes"), { ...rest, name: nm || n.name, parent, createdAt: serverTimestamp() });
  if (n.type === "folder") for (const k of kidsOf(n.id)) await cloneNode(k, r.id);
}
function showViews(n){
  const v = [...(views[n.id]||[])].sort((a,b) => (b.count||0) - (a.count||0));
  const t = (x) => x.last?.toMillis ? new Date(x.last.toMillis()).toLocaleString() : "—";
  modal("👁 " + n.name, `<p class="sub">${tot(n.id)} total opens • ${v.length} unique users</p>` + (v.length
    ? `<div style="overflow:auto"><table><tr><th>Name</th><th>Email</th><th>Opens</th><th>Last opened</th></tr>${v.map(x => `<tr><td>${esc(x.name||"—")}</td><td>${esc(x.email||"")}</td><td><b>${x.count||0}</b></td><td>${t(x)}</td></tr>`).join("")}</table></div>`
    : '<p class="sub" style="margin-top:10px">No one has opened this yet.</p>'));
}

window.newFolder = async () => {
  const name = prompt("Folder name (e.g. Maths-1, Notes, PYQ, Question Bank):"); if (!name) return;
  await addDoc(collection(db,"nodes"), { name:name.trim(), type:"folder", parent:cur, createdAt:serverTimestamp() }); load();
};
window.upload = async files => {
  for (const f of files) {
    try {
      $("upst").textContent = "Uploading: " + f.name;
      const fd = new FormData(); fd.append("file", f); fd.append("upload_preset", PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/auto/upload`, { method:"POST", body:fd });
      const data = await res.json();
      if (!data.secure_url) throw new Error(data.error?.message || "Upload failed");
      await addDoc(collection(db,"nodes"), { name:f.name.replace(/\.[^.]+$/,""), type:"file", kind:f.type==="application/pdf"?"pdf":"img", url:data.secure_url, parent:cur, createdAt:serverTimestamp() });
    } catch(e){ alert("Failed: " + f.name + "\n" + e.message); }
  }
  $("upst").textContent = "✅ Upload complete"; $("up").value = ""; load();
};
window.addLink = async () => {
  const url = prompt("Paste the direct file link (PDF or image):"); if (!url) return;
  const name = prompt("Display name:"); if (!name) return;
  const kind = /\.pdf($|\?)/i.test(url) ? "pdf" : "img";
  await addDoc(collection(db,"nodes"), { name:name.trim(), type:"file", kind, url:url.trim(), parent:cur, createdAt:serverTimestamp() }); load();
};
async function delNode(n){
  const ids = n.type === "folder" ? descIds(n.id) : [];
  if (!confirm(`Delete "${n.name}"` + (ids.length ? ` and ${ids.length} item(s) inside it` : "") + "?")) return;
  for (const id of [...ids, n.id]) await deleteDoc(doc(db,"nodes",id));
  load();
}

window.loadReqs = async () => {
  const s = await getDocs(collection(db,"requests")), ms = r => r.createdAt?.toMillis?.() || 0;
  const L = {open:"⏳ Open", done:"✅ Added", rejected:"❌ Rejected"};
  const l = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.status!=="open")-(b.status!=="open") || ms(b)-ms(a));
  $("rl").innerHTML = l.length ? l.map(r => `<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(r.title)}</b><span>${L[r.status]||L.open}</span></div>
    <p class="sub" style="margin-top:6px">${esc(r.details||"—")}</p><p class="sub">👤 ${esc(r.name||"")} • ${esc(r.email)}</p>
    <input id="rp_${r.id}" placeholder="Message / reason for student (optional)" value="${esc(r.reply||"")}">
    <div class="row" style="margin-top:6px"><button class="g" onclick="setReq('${r.id}','done')">✅ Added</button><button class="r" onclick="setReq('${r.id}','rejected')">❌ Reject</button>
    <button class="s" onclick="setReq('${r.id}','open')">↺ Reopen</button><button class="s" onclick="delReq('${r.id}')">🗑 Delete</button></div></div>`).join("") : "<p class='sub'>No requests yet.</p>";
  const o = l.filter(r => (r.status||"open") === "open").length; $("rc").textContent = o; $("rc").classList.toggle("hide", !o);
};
window.setReq = async (id,v) => {
  const reply = $("rp_"+id).value.trim();
  if (v === "rejected" && !reply) return alert("Please write a reason for rejecting.");
  await updateDoc(doc(db,"requests",id), { status:v, reply, repliedAt:serverTimestamp() }); loadReqs();
};
window.delReq = async id => { if (confirm("Delete this request?")) { await deleteDoc(doc(db,"requests",id)); loadReqs(); } };

async function pendingCount(){
  const s = await getDocs(query(collection(db,"users"), where("approved","==",false)));
  $("pc").textContent = s.size; $("pc").classList.toggle("hide", !s.size);
}
let trialCfg = { enabled:false, hours:24 };
async function loadTrial(){
  try { const d = await getDoc(doc(db,"studySettings","trial")); if (d.exists()) trialCfg = { enabled:!!d.data().enabled, hours:+d.data().hours || 24 }; } catch(e){}
  $("trh").value = trialCfg.hours; $("trst").textContent = trialCfg.enabled ? "🟢 ON" : "🔴 OFF";
  $("trtog").textContent = trialCfg.enabled ? "Turn OFF" : "Turn ON"; $("trtog").className = trialCfg.enabled ? "r" : "g";
}
window.toggleTrial = async () => { await setDoc(doc(db,"studySettings","trial"), { enabled:!trialCfg.enabled, hours:trialCfg.hours }, { merge:true }); loadUsers(); };
window.saveTrial = async () => { const h = +$("trh").value; if (!(h > 0)) return alert("Enter valid hours"); await setDoc(doc(db,"studySettings","trial"), { enabled:trialCfg.enabled, hours:h }, { merge:true }); loadUsers(); };
const stText = u => {
  if (u.approved) return "✅ Approved";
  const t = u.trialStarted?.toMillis?.(); if (!t) return "⏳ Pending";
  const l = t + trialCfg.hours*36e5 - Date.now();
  return trialCfg.enabled && l > 0 ? `🎁 Trial (${Math.floor(l/36e5)}h ${Math.floor(l%36e5/6e4)}m left)` : "⌛ Trial ended • Pending";
};
window.loadUsers = async () => {
  await loadTrial();
  const q = $("srch").value.toLowerCase();
  const snap = await getDocs(collection(db,"users"));
  let h = "<tr><th>Name</th><th>Email</th><th>Device</th><th>Status</th><th>Action</th></tr>";
  snap.docs.map(d => ({id:d.id, ...d.data()}))
    .filter(u => (u.name+u.email).toLowerCase().includes(q))
    .sort((a,b) => { const act = u => (!u.approved || (u.pendingDevice && u.pendingDevice !== u.deviceId)) ? 0 : 1; return act(a)-act(b) || (b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0); })
    .forEach(u => {
      const np = u.pendingDevice && u.pendingDevice !== u.deviceId;
      h += `<tr><td>${esc(u.name||"")}</td><td>${esc(u.email)}</td>
      <td>${esc(u.deviceId)}${np?`<br><small style="color:#ffb86b">New: ${esc(u.pendingDevice)}</small>`:""}</td>
      <td>${stText(u)}</td>
      <td><div class="row"><button class="${u.approved?"r":""}" onclick="setAp('${u.id}',${!u.approved})">${u.approved?"Block":"Approve"}</button>
      ${np?`<button class="g" onclick="setDev('${u.id}','${esc(u.pendingDevice)}')">Approve New Device</button>`:""}</div></td></tr>`;
    });
  $("utable").innerHTML = h; pendingCount();
};
window.setAp = async (id,v) => { await updateDoc(doc(db,"users",id), { approved:v }); loadUsers(); };
window.setDev = async (id,d) => { await updateDoc(doc(db,"users",id), { deviceId:d, approved:true }); loadUsers(); };
</script>
</body>
</html>
